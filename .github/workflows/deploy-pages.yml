name: Build and deploy GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore generator
        run: |
          base64 --decode build_site.sh.gz.b64 | gzip --decompress > build_site.sh
          chmod +x build_site.sh

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install yt-dlp
        run: python -m pip install --upgrade yt-dlp

      - name: Generate Omniverse site and direct YouTube links
        run: bash ./build_site.sh "$GITHUB_WORKSPACE/public"

      - name: Add Kurose networking study app
        run: |
          mkdir -p public/reti
          base64 --decode reti-kurose-grind.html.gz.b64 | gzip --decompress > public/reti/index.html

      - name: Add standalone Meal Builder
        run: |
          set -euo pipefail
          mkdir -p public/meal
          python - <<'PY'
          import base64
          import gzip
          import pathlib
          import re

          source = pathlib.Path("meal-builder.html.gz.b64")
          encoded = re.sub(r"[^A-Za-z0-9+/=]", "", source.read_text(encoding="utf-8"))
          encoded += "=" * (-len(encoded) % 4)
          compressed = base64.b64decode(encoded, validate=True)
          html = gzip.decompress(compressed)
          pathlib.Path("public/meal/index.html").write_bytes(html)
          print(f"Meal Builder standalone: OK — {len(compressed)} byte gzip, {len(html)} byte HTML")
          PY

      - name: Validate generated sites
        run: |
          set -euo pipefail
          test -s public/index.html
          grep -q "The Legacy of the Omniverse" public/index.html
          test -s public/reti/index.html
          grep -q "Kurose Grind" public/reti/index.html
          test "$(grep -o 'class="task video-task"' public/reti/index.html | wc -l)" -eq 40
          test "$(grep -o 'class="task reading-task"' public/reti/index.html | wc -l)" -eq 8
          test -s public/meal/index.html
          grep -q "Exact Engine 1.3 · standalone" public/meal/index.html
          grep -q "Piano giornaliero" public/meal/index.html
          grep -q "MealBuilderCore" public/meal/index.html
          ! grep -q 'src="./core.js"' public/meal/index.html
          ! grep -q "new Worker" public/meal/index.html

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: public

  deploy:
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
