name: Build and deploy GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore generator
        run: |
          base64 --decode build_site.sh.gz.b64 | gzip --decompress > build_site.sh
          chmod +x build_site.sh

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install yt-dlp
        run: python -m pip install --upgrade yt-dlp

      - name: Generate Omniverse site and direct YouTube links
        run: bash ./build_site.sh "$GITHUB_WORKSPACE/public"

      - name: Add StudyMesh Defense Grind
        run: |
          set -euo pipefail
          mkdir -p public/reti
          python - <<'PY'
          from pathlib import Path
          import base64
          import gzip

          source = Path("reti-kurose-grind.html.gz.b64")
          target = Path("public/reti/index.html")
          encoded = source.read_text(encoding="ascii").strip()

          def unpack(candidate: str):
              try:
                  raw = base64.b64decode(candidate, validate=True)
                  html = gzip.decompress(raw)
              except Exception:
                  return None
              if b"StudyMesh Defense Grind" not in html:
                  return None
              return html

          html = unpack(encoded)
          if html is None:
              # The blob committed by "Emphasize Botta defense priorities" is
              # one Base64 character short. The gzip payload itself tells us
              # unambiguously which character is missing via its CRC/ISIZE.
              alphabet = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/="
              start = max(0, len(encoded) - 256)
              repaired = None
              for pos in range(start, len(encoded) + 1):
                  for char in alphabet:
                      candidate = encoded[:pos] + char + encoded[pos:]
                      decoded = unpack(candidate)
                      if decoded is not None:
                          repaired = (pos, char, decoded)
                          break
                  if repaired is not None:
                      break

              if repaired is None:
                  raise SystemExit(
                      "StudyMesh archive is corrupt and no single-character repair "
                      "was found in the final 256 Base64 characters"
                  )

              pos, char, html = repaired
              print(
                  "Recovered StudyMesh archive: inserted "
                  f"{char!r} at Base64 offset {pos} "
                  f"({len(encoded) - pos} chars from end)"
              )
          else:
              print("StudyMesh archive: Base64/gzip integrity OK")

          target.write_bytes(html)
          print(f"StudyMesh HTML: OK — {len(html)} bytes")
          PY

      - name: Add standalone Meal Builder
        run: |
          set -euo pipefail
          mkdir -p public/meal

          cat meal-standalone-v13/meal.*.b64part > /tmp/meal-builder.b64
          echo "5ae84366ed8f05233788bc9e1b39522695e0fae688eabb662d6418d41e37e80e  /tmp/meal-builder.b64" | sha256sum --check --strict

          base64 --decode /tmp/meal-builder.b64 > /tmp/meal-builder.gz
          echo "be8655c5bdabe4ca0cb08a444f1685343515a612deda24096199793723e5ccd0  /tmp/meal-builder.gz" | sha256sum --check --strict

          gzip -t /tmp/meal-builder.gz
          gzip --decompress --stdout /tmp/meal-builder.gz > public/meal/index.html
          echo "Meal Builder standalone: OK — $(stat -c%s /tmp/meal-builder.gz) byte gzip, $(stat -c%s public/meal/index.html) byte HTML"

      - name: Validate generated sites
        run: |
          set -euo pipefail
          test -s public/index.html
          grep -q "The Legacy of the Omniverse" public/index.html
          test -s public/reti/index.html
          grep -q "StudyMesh Defense Grind" public/reti/index.html
          test "$(grep -o 'class="task video-task"' public/reti/index.html | wc -l)" -eq 20
          test "$(grep -o 'class="task botta-task' public/reti/index.html | wc -l)" -eq 14
          test "$(grep -o 'class="task botta-task critical-botta"' public/reti/index.html | wc -l)" -eq 3
          grep -q "Regola anti-arronzamento" public/reti/index.html
          grep -q "FONDAMENTALE DIFESA" public/reti/index.html
          grep -q "CORE DOCENTE" public/reti/index.html
          grep -q 'data-task-id="video-23"' public/reti/index.html
          grep -q 'data-task-id="video-24"' public/reti/index.html
          grep -q 'data-task-id="video-29"' public/reti/index.html
          grep -q 'data-task-id="video-31"' public/reti/index.html
          grep -q 'data-task-id="botta-l12"' public/reti/index.html
          grep -q 'data-task-id="botta-l13"' public/reti/index.html
          grep -q 'data-task-id="botta-l17"' public/reti/index.html
          grep -q 'data-task-id="botta-l21"' public/reti/index.html
          grep -q "Python & concorrenza" public/reti/index.html
          grep -q "Adversarial oral" public/reti/index.html
          test -s public/meal/index.html
          grep -q "Exact Engine 1.3 · standalone" public/meal/index.html
          grep -q "Piano giornaliero" public/meal/index.html
          grep -q "MealBuilderCore" public/meal/index.html
          ! grep -q 'src="./core.js"' public/meal/index.html
          ! grep -q "new Worker" public/meal/index.html

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: public

  deploy:
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
